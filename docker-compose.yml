services:
  app:
    build:
      context: .
    container_name: folgas-mahatma-app
    ports:
      - "8001:8000"

    env_file:
      - .env

    volumes:
      - .:/app
      - ./render_disk:/var/data

    command: >
      sh -c "python -m flask --app app.py run --host=0.0.0.0 --port ${PORT:-8000} --debug"